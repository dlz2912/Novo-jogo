<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Batalha de Animais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0e1218;font-family:Trebuchet MS,Segoe UI,sans-serif;user-select:none;touch-action:none}
#wrap{position:relative;width:100vw;height:100vh}
canvas#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));pointer-events:none;max-width:58vw}
.panel{background:rgba(12,16,28,.82);border:2px solid #6a5a3a;border-radius:10px;padding:6px 10px;color:#f4efe4;font-size:12px;line-height:1.45}
.panel b{color:#ffd24a}
#cfgBtn,#chatBtn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;width:44px;height:44px;border-radius:12px;border:2px solid #ffd24a;background:rgba(20,16,8,.9);color:#ffd24a;font-size:18px}
#cfgBtn{right:calc(8px + env(safe-area-inset-right,0px))}
#chatBtn{right:calc(56px + env(safe-area-inset-right,0px))}
#chatDock{display:none;position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(58px + env(safe-area-inset-top,0px));width:min(300px,78vw);max-height:55vh;background:rgba(12,16,24,.94);border:2px solid #ffd24a;border-radius:12px;z-index:16;padding:8px;flex-direction:column}
#chatDock.show{display:flex}
#chatLog{flex:1;overflow:auto;font-size:12px;color:#f4efe4;max-height:28vh;margin-bottom:6px}
#chatLog div{margin:4px 0}
#chatDock input{width:100%;padding:8px;border-radius:8px;border:1px solid #6a5a3a;background:#1a2230;color:#fff}
#toast{display:none}
#toast.show{opacity:1}
#overlay{position:absolute;inset:0;background:rgba(6,8,14,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#overlay.show{display:flex}
.card{background:#1a2230;border:3px solid #ffd24a;border-radius:16px;padding:16px;width:min(560px,94vw);max-height:86vh;overflow:auto;color:#f4efe4}
.card h2{color:#ffd24a;margin-bottom:8px;text-align:center}
.card p{font-size:14px;line-height:1.45;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.btn{background:linear-gradient(#4a6aad,#2a3e72);border:2px solid #8ab0ff;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.btn.gold{background:linear-gradient(#e0a020,#8a5a10);border-color:#ffd24a}
.btn.green{background:linear-gradient(#3a9a4a,#1a5a22);border-color:#8fe09a}
.btn:active{transform:translateY(1px)}
.slot{width:88px;min-height:64px;border:2px solid #5a6a8a;border-radius:10px;background:#141c28;padding:5px;font-size:10px;text-align:center}
.slot.on{border-color:#ffd24a}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex i{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#121820;border:1px solid #3a4a5a;border-radius:8px;padding:6px 4px;font-size:12px;text-align:center;min-height:78px;font-style:normal;cursor:pointer}
.dex i.seen{border-color:#8ab0ff;color:#cfe4ff}
.dex i.got{border-color:#ffd24a;background:#2a2410;color:#ffd24a}
.dex i svg{display:block;margin:2px auto}
.dex i .num{font-size:11px;opacity:.85}
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
.tabs .btn{padding:7px 9px;font-size:12px;min-width:0}
.tabs .btn.on{border-color:#ffd24a;background:linear-gradient(#8a6a10,#5a4010)}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
@media(max-width:620px){.dex{grid-template-columns:repeat(2,1fr)}.card{padding:12px}}
#battleUI{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:8px;z-index:13;width:min(420px,94vw)}
#battleUI.show{display:flex}
.bmGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.bmBtn{padding:12px 10px;border-radius:12px;border:2px solid #7fb4ff;background:linear-gradient(#3a6ea5,#1f3f66);color:#fff;font-weight:700;font-size:15px}
#subList{display:none;flex-direction:column;gap:6px;width:100%;max-height:42vh;overflow:auto}
#subList.show{display:flex}
.itemBtn{padding:10px 12px;border-radius:10px;border:2px solid #7fe0a0;background:linear-gradient(#2a6a40,#143820);color:#fff;text-align:left;font-size:13px}
.itemBtn small{display:block;opacity:.8;font-size:11px}
#dpad{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,16px));width:148px;height:148px;display:none;z-index:11}
#dpad button{position:absolute;width:48px;height:48px;border:2px solid #8ab0ff;background:linear-gradient(#3a4a6a,#1a2438);color:#fff;font-size:18px;font-weight:700;border-radius:10px}
#dpad .u{left:50px;top:0} #dpad .d{left:50px;bottom:0} #dpad .l{left:0;top:50px} #dpad .r{right:0;top:50px}
#worldBtns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,16px));display:none;flex-direction:column;gap:8px;z-index:11}
.wbtn{width:56px;height:56px;border-radius:50%;border:2px solid #ffd24a;background:rgba(40,30,10,.85);color:#fff;font-weight:700;font-size:16px}
@media (pointer:coarse){#dpad{display:block} #worldBtns{display:flex}}
#wrap.fight #dpad, #wrap.fight #worldBtns, #wrap.menu #dpad, #wrap.menu #worldBtns{display:none !important}
#overlay.show ~ #dpad, #overlay.show ~ #worldBtns{display:none !important}

</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<button id="chatBtn" type="button">💬</button><button id="cfgBtn" type="button">⚙</button>
<div id="chatDock"><p id="chatHead" style="color:#ffd24a;font-size:12px;margin:0 0 4px">Chat da sala</p><div id="chatLog"></div><input id="chatIn" maxlength="80" placeholder="Escreva para todos…"><div class="row"><button class="btn gold" id="btnSendChat">Enviar</button></div><div class="row"><button class="btn gold" id="btnInv1">1x1</button><button class="btn gold" id="btnInv2">Dupla</button></div></div>
<div id="hud"><div class="panel" id="info">—</div></div>
<div id="toast"></div>
<div id="dpad">
  <button class="u" data-k="w">▲</button>
  <button class="d" data-k="s">▼</button>
  <button class="l" data-k="a">◀</button>
  <button class="r" data-k="d">▶</button>
</div>
<div id="worldBtns">
  <button class="wbtn" id="btnE">E</button>
</div>
<div id="battleUI">
  <div class="bmGrid" id="mainMenu">
    <button class="bmBtn" id="bAtk">Atacar</button>
    <button class="bmBtn" id="bBag">Mochila</button>
    <button class="bmBtn" id="bPet">Pet</button>
    <button class="bmBtn" id="bRun">Fuga</button>
  </div>
  <div id="subList"></div>
  <button class="btn" id="bBack" style="display:none">Voltar</button>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
</div>

const map=[];
for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++) map[y][x]=T.G;}
function fill(x,y,w,h,t){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) if(i>=0&&j>=0&&i<MW&&j<MH) map[j][i]=t;}

function town(x,y,w,h,cols,cname,exits){
  exits=exits||[];
  fill(x,y,w,h,T.S);
  const mx=x+((w/2)|0), my=y+((h/2)|0);
  lineH(x+1,x+w-2,my,T.P); lineH(x+1,x+w-2,my+1,T.P);
  lineV(y+1,y+h-2,mx,T.P); lineV(y+1,y+h-2,mx+1,T.P);

  if(exits.indexOf('w')>=0){ map[my][x]=T.P; map[my+1][x]=T.P; if(x-1>=0){ map[my][x-1]=T.P; map[my+1][x-1]=T.P; } }
  if(exits.indexOf('s')>=0){ map[y+h-1][mx]=T.P; map[y+h-1][mx+1]=T.P; if(y+h<MH){ map[y+h][mx]=T.P; map[y+h][mx+1]=T.P; } }
  if(exits.indexOf('n')>=0){ map[y][mx]=T.P; map[y][mx+1]=T.P; if(y-1>=0){ map[y-1][mx]=T.P; map[y-1][mx+1]=T.P; } }
  const lines=['Tem pão esfriando na janela.','Um gato pixelado dorme no telhado.','A dona acena de trás da porta.','Cheira a sopa.','Há um vaso com folha rara.','A casa está quieta.'];
  for(let j=y+1;j<y+h-1;j++) for(let i=x+1;i<x+w-1;i++){
    if(map[j][i]!==T.S) continue;
    let road=0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const row=map[j+dy]; if(!row) continue;
      if(row[i+dx]===T.P||row[i+dx]===T.Q) road=1;
    }
    if(road) continue;
    if(map[j][i-1]===T.H||map[j-1][i]===T.H||map[j][i+1]===T.H) continue;
    if(map[j-1]&&(map[j-1][i-1]===T.H||map[j-1][i+1]===T.H)) continue;
    if(((i+j*3)%5)!==1) continue;
    map[j][i]=T.H;
    HOUSES.push({x:i,y:j,col:cols[HOUSES.length%cols.length],kind:'casa',city:cname,line:lines[(i+j)%lines.length],used:0,skin:HOUSES.length%2});
  }
  for(let i=x-1;i<=x+w;i++) for(const fy of [y-1,y+h]){
    if(i>=0&&fy>=0&&i<MW&&fy<MH && map[fy][i]!==T.P && map[fy][i]!==T.Q && map[fy][i]!==T.W) map[fy][i]=T.N;
  }
  for(let j=y-1;j<=y+h;j++) for(const fx of [x-1,x+w]){
    if(fx>=0&&j>=0&&fx<MW&&j<MH && map[j][fx]!==T.P && map[j][fx]!==T.Q && map[j][fx]!==T.W) map[j][fx]=T.N;
  }
}

function isCommon(tipo){return !tipo || tipo==='nenhum';}
function eff(a,d){

function cloneMoves(arr){return arr.map(m=>({n:m.n,t:m.t,p:m.p,tipo:m.tipo||null,pp:m.pp,max:m.pp,st:m.st}));}
function applyLearn(pet){
  const set=LEARN_BY_TYPE[pet.type]||LEARN_BY_TYPE.nenhum;
  const lvls=[5,10,15];
  set.forEach((m,i)=>{ if(pet.lvl>=lvls[i] && !pet.moves.find(x=>x.n===m.n)) pet.moves.push({...m,max:m.pp}); });
  while(pet.moves.length>4) pet.moves.shift();
}
function makePet(key,lvl,opt={}){
  const s=DEXMAP[key]||DEX[0]; const nat=opt.nat||NATK[(Math.random()*NATK.length)|0];
  const N=NATS[nat]; const g=1+(lvl-1)*0.1;
  const pet={id:Math.random().toString(36).slice(2,8),key:s.key,dex:s.id,name:opt.name||s.name,nick:opt.nick||'',type:s.type,color:s.color,shape:s.shape,lvl,
    nat, evos:0, xp:0, xpNext:40+lvl*20,
    maxhp:Math.round(s.hp*g*N.hp), atk:Math.round(s.atk*g*N.atk), def:Math.round(s.def*g*N.def), spd:Math.round(s.spd*g*N.spd),
    moves:cloneMoves(s.moves), st:null};
  pet.hp=pet.maxhp; applyLearn(pet);
  if(lvl>=8){pet.evos=1; pet.maxhp=Math.round(pet.maxhp*1.25); pet.atk=Math.round(pet.atk*1.2); pet.hp=pet.maxhp;}
  if(lvl>=16){pet.evos=2; pet.maxhp=Math.round(pet.maxhp*1.25); pet.atk=Math.round(pet.atk*1.2); pet.hp=pet.maxhp;}
  if(s.legend){ pet.legend=true; pet.maxhp=Math.round(pet.maxhp*1.45); pet.atk=Math.round(pet.atk*1.35); pet.def=Math.round(pet.def*1.25); pet.hp=pet.maxhp; pet.lvl=Math.max(pet.lvl,12); }
  return pet;
}
function pool(zone){return DEX.filter(d=>d.zone===zone && !d.legend);}
function pickFrom(list){if(!list||!list.length) return DEX[0]; return list[(Math.random()*list.length)|0]||DEX[0];}

function tryResolvePvp(){
  if(!battle||battle.kind!=='pvp'||net.role!=='host') return;
  const ph=battle.picks.host, pg=battle.picks.guest;
  if(ph==null||pg==null) return;
  const hostPet=battle.iamHost?battle.p:battle.e;
  const guestPet=battle.iamHost?battle.e:battle.p;
  const mh=hostPet.moves[ph]||hostPet.moves[0];
  const mg=guestPet.moves[pg]||guestPet.moves[0];
  const hs=hostPet.spd||8, gs=guestPet.spd||8;
  const firstHost=hs>=gs;
  const steps=firstHost?[['host',mh],['guest',mg]]:[['guest',mg],['host',mh]];
  const log=[];
  function hit(att,def,m){
    if(m.pp>0) m.pp--;
    if(m.t==='heal'){ const h=m.p+att.lvl; att.hp=Math.min(att.maxhp,att.hp+h); log.push((att.name||'')+' curou +'+h); return; }
    if(m.t==='def'){ att.defBuff=(att.defBuff||0)+1; log.push((att.name||'')+' defendeu'); return; }
    const tipo=m.tipo||att.type; let mul=eff(tipo,def.type);
    let dmg=Math.max(1,Math.round((att.atk*0.55+m.p)*mul));
    if(def.defBuff) dmg=Math.round(dmg*0.7);
    def.hp=Math.max(0,def.hp-dmg);
    log.push((att.name||'')+' usou '+m.n+' · '+dmg);
  }
  for(const [who,m] of steps){
    if(who==='host') hit(hostPet,guestPet,m); else hit(guestPet,hostPet,m);
    if(hostPet.hp<=0||guestPet.hp<=0) break;
  }
  const msg={t:'pvpturn',
    hostHp:hostPet.hp,guestHp:guestPet.hp,
    hostMax:hostPet.maxhp,guestMax:guestPet.maxhp,
    log, over: hostPet.hp<=0||guestPet.hp<=0,
    hostWin: guestPet.hp<=0};
  battle.picks={};
  netSend(msg);
  applyPvpTurn(msg);
}
function applyPvpTurn(d){
  if(!battle||battle.kind!=='pvp') return;
  if(net.role==='host'){ battle.p.hp=d.hostHp; battle.e.hp=d.guestHp; }

      else loseB();
      return;
    }
    showMainB();
  };
}

function writeStore(key, raw){
  try{ localStorage.setItem(key, raw); return 'local'; }catch(e){}
  try{ sessionStorage.setItem(key, raw); return 'sessao'; }catch(e){}
  return null;
}
function readStore(key){

function downloadSave(raw){

function applySave(d){

function loadGame(){

    const raw=readStore('mundoPets_v4'); if(!raw) return false;

function loadSaveFile(inp){

  r.readAsText(f);
}

function tileAt(px,py){const x=Math.floor(px/TILE),y=Math.floor(py/TILE); if(x<0||y<0||x>=MW||y>=MH) return T.R; return map[y][x];}
function solid(px,py){
  const t=tileAt(px,py);
  if(t===T.W||t===T.R||t===T.N) return true;
  if(hitsHouse(px,py)) return true;
  if(t===T.K && !bag.picareta) return true;
  return false;
}
function hitsHouse(px,py){
  for(const h of HOUSES){
    const hx=h.x*TILE+TILE*0.5, hy=h.y*TILE+TILE*0.72;
    if(Math.abs(px-hx)<14 && Math.abs(py-hy)<10) return true;
  }
  return false;
}
function can(px,py){const r=10; return !solid(px-r,py-r)&&!solid(px+r,py-r)&&!solid(px-r,py+r)&&!solid(px+r,py+r);}
function walkNear(tx,ty,name){
  const order=[[0,2],[0,1],[1,2],[-1,2],[2,1],[-2,1],[0,3],[1,0],[-1,0],[0,0]];
  for(const [dx,dy] of order){
    const x=(tx+dx)*TILE+TILE/2, y=(ty+dy)*TILE+TILE/2;
    if(can(x,y)) return {x,y,name:name||'Folha'};
  }
  return {x:23*TILE+TILE/2,y:48*TILE,name:name||'Vila Folha'};
}
function putOnStreet(){
  if(can(player.x,player.y)) return;
  const s=walkNear((player.x/TILE)|0,(player.y/TILE)|0,lastHosp.name);
  player.x=s.x; player.y=s.y;
}
function onCave(px,py){return tileAt(px,py)===T.C;}
function nearWater(px,py){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++) if(tileAt(px+dx*TILE*0.7,py+dy*TILE*0.7)===T.W) return true;
  return false;
}

function npcLine(n){
  if(n.relic && bag[n.relic] && n.afterGive) return n.afterGive;
  if(n.relic && badges[n.needBadge] && n.ready) return n.ready;
  if(n.quest && bag[n.quest] && n.afterQuest) return n.afterQuest;
  const nb=Object.keys(badges).length;

  return n.say;

function autoEncounters(){
  if(state!=='world'||fishing||cool>0) return;
  ensureAC();
  const all=[...LEADERS.filter(L=>!['l1','l2','l3','l4'].includes(L.id)),CHAMP];
  for(const L of all){
    if(badges[L.id]||(L.id==='champ'&&champDown)) continue;
    if(L.id==='champ' && Object.keys(badges).length<8) continue;
    const d=tilesFrom(L.x,L.y);
    if(d>0 && d<=3){ startTrainer(L); return; }
  }
  for(const n of NPCS){
    if(!n.quest || bag[n.quest]) continue;
    const d=tilesFrom(n.x,n.y);
    if(d>0 && d<=3){
      startTrainer({id:'q_'+n.quest,name:n.name,title:'Guardião',key:n.key,lvl:n.lvl,quest:n.quest,facing:'down',x:n.x,y:n.y});
      return;
    }
  }
  const tx=(player.x/TILE)|0, ty=(player.y/TILE)|0;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const list=bushGrid[(tx+dx)+','+(ty+dy)];
    if(!list) continue;
    for(const b of list){
      if(b.empty>0) continue;
      if(Math.hypot(player.x-b.x,player.y-b.y)<22){ sfx('rustle'); startWild(b); return; }
    }
  }
  if(nearWater(player.x,player.y)){
    if(!bag.vara) return;
    startFish();
    return;
  }
  for(const m of caveMobs){
    if(m.empty>0) continue;
    if(Math.hypot(player.x-m.x,player.y-m.y)<28){
      if(!bag.lampiao){ toast('Algo se mexe no escuro. Você precisa do Lampião.'); return; }
      startCaveEnc(m); return;
    }
  }
  for(const d of DUNGEONS){
    if(tilesFrom(d.x,d.y)<=1.4){ enterDungeon(d); return; }
  }
  /* lendários agora no fundo das masmorras */
}

function questReady(q){
  if(qlog[q.id]!=='open') return false;
  if(q.type==='talk') return !!qprog[q.id];
  if(q.type==='item') return (bag[q.item]||0)>=q.qty;
  if(q.type==='catch') return (qprog[q.id]||0)>=q.qty;
  if(q.type==='coins') return coins>=q.qty;
  return false;
}
function giveRew(q){
  if(q.type==='item') bag[q.item]-=q.qty;
  if(q.type==='coins') coins-=q.qty;
  const r=q.rew||{};
  if(r.coins) coins+=r.coins;
  Object.keys(r).forEach(k=>{ if(k!=='coins') bag[k]=(bag[k]||0)+(r[k]||0); });
  qlog[q.id]='done'; sfx('win');
}
function takeQuest(id){
  const q=activeQuests.find(x=>x.id===id); if(!q) return;
  if(qlog[id]==='done'){toast('Esta missão já foi concluída.');return;}
  qlog[id]='open'; qprog[id]=qprog[id]||0; toast('Missão aceita: '+q.name); openGuild();
}
function turnQuest(id){
  const q=activeQuests.find(x=>x.id===id); if(!q||!questReady(q)){toast('Ainda não está pronta.');return;}
  giveRew(q); toast('Recompensa de '+q.name+'!'); openGuild();
}

let dungeonRun=null;
function floorLoot(f){
  if(f<=1) return [['suco',1],['petbola',1],['coins',30],['antidoto',1]];
  if(f===2) return [['sucao',1],['superbola',1],['coins',70],['isca_agua',1],['antidoto',2]];
  if(f===3) return [['hiperbola',1],['superbola',2],['sucao',2],['coins',120],['isca_fogo',1]];
  return [['hiperbola',2],['sucao',2],['coins',200],['superbola',2],['isca_planta',2]];
}
function floorLvl(f){return 3+f*3;}
function buildFloor(d,f){
  const list=pool(d.pool); const nPet=2+(f>1?1:0); const nChest=1+(f>=2?1:0)+(f>=4?1:0);
  const pets=[], chests=[];
  for(let i=0;i<nPet;i++){
    const s=list.length?list[(Math.random()*list.length)|0]:DEX[0];
    pets.push({x:70+Math.random()*260,y:80+Math.random()*160,key:s.key,lvl:floorLvl(f)+((Math.random()*3)|0),empty:0});
  }
  for(let i=0;i<nChest;i++) chests.push({x:80+Math.random()*240,y:90+Math.random()*150,open:0});
  if(f===d.floors && d.legends){
    d.legends.forEach((name,i)=>{
      const s=TEMPLOS.find(z=>z.name===name);
      if(!s || caught[s.dex]) return;
      pets.push({x:120+i*90,y:110,key:s.key,lvl:14,empty:0,legend:1,spec:s});
    });
  }
  return {pets,chests};
}
function enterDungeon(d){
  if(d.need && !bag[d.need]){ toast('Precisa de '+d.need+' para entrar.'); return; }
  dungeonRun={d,floor:1,wx:player.x,wy:player.y,floors:{}};
  dungeonRun.floors[1]=buildFloor(d,1);
  player.x=200; player.y=260;
  state='dungeon'; cool=40;
  toast(d.name+' — andar 1/'+d.floors+'. Pets fracos, baús simples.');
}
function leaveDungeon(){
  if(!dungeonRun) return;
  player.x=dungeonRun.wx; player.y=dungeonRun.wy;
  dungeonRun=null; state='world'; cool=80;
}
function dungeonFloor(f){
  dungeonRun.floor=f;
  if(!dungeonRun.floors[f]) dungeonRun.floors[f]=buildFloor(dungeonRun.d,f);
  player.x=200; player.y=200; cool=30;
  toast(dungeonRun.d.name+' — andar '+f+'/'+dungeonRun.d.floors+'. Nível ~'+floorLvl(f)+'.');
}
function openChest(c){
  if(c.open){ toast('Baú vazio.'); return; }
  c.open=1; cool=40;
  const tab=floorLoot(dungeonRun.floor);
  const pick=tab[(Math.random()*tab.length)|0];
  if(pick[0]==='coins'){ coins+=pick[1]; toast('Baú do andar '+dungeonRun.floor+': +'+pick[1]+' moedas!'); }
  else { bag[pick[0]]=(bag[pick[0]]||0)+pick[1]; toast('Baú do andar '+dungeonRun.floor+': '+pick[0]+' x'+pick[1]+'!'); }
  sfx('win');
}
function startDungeonWild(g){
  if(g.legend && g.spec){ startLegend(g.spec); battle.g=g; return; }
  const pet=makePet(g.key,g.lvl);

function dungeonTick(){
  const fl=dungeonRun.floors[dungeonRun.floor];
  if(player.y<48){
    if(dungeonRun.floor<dungeonRun.d.floors) dungeonFloor(dungeonRun.floor+1);
    else toast('Fim da masmorra. Não há andar abaixo.');
    return;
  }
  if(player.y>310){
    if(dungeonRun.floor<=1) leaveDungeon();
    else dungeonFloor(dungeonRun.floor-1);
    return;
  }
  for(const c of fl.chests){
    if(!c.open && Math.hypot(player.x-c.x,player.y-c.y)<28){ openChest(c); return; }
  }
  for(const g of fl.pets){
    if(g.empty>0) continue;
    if(Math.hypot(player.x-g.x,player.y-g.y)<26){ startDungeonWild(g); return; }
  }
}

    if(Math.hypot(player.x-(q.x+.5)*TILE,player.y-(q.y+.5)*TILE)<40){ talkQuestNpc(q); return; }
  }
  if(Math.hypot(player.x-(GUILD.x+.5)*TILE,player.y-(GUILD.y+.5)*TILE)<48){ openGuild(); return; }
  for(const h of HOUSES){

let dexType='todos', dexPage=0;
const DEX_PAGE=8;
const DEX_TABS=[['todos','Todos'],['agua','Água'],['fogo','Fogo'],['planta','Planta'],['vento','Vento'],['terra','Terra'],['pedra','Pedra'],['fantasma','Fantasma'],['psico','Psico'],['nenhum','Sem tipo'],['lendario','★ Lendário']];
function dexList(){
  if(dexType==='lendario') return DEX.filter(d=>d.legend);
  if(dexType==='todos') return DEX.slice();
  return DEX.filter(d=>d.type===dexType);
}
function openDex(type,page){
  state='menu';
  if(type){ dexType=type; dexPage=0; }
  if(page!=null && page!=='') dexPage=+page;
  const list=dexList();
  const pages=Math.max(1, Math.ceil(list.length/DEX_PAGE));
  if(dexPage>pages-1) dexPage=pages-1;
  if(dexPage<0) dexPage=0;
  const slice=list.slice(dexPage*DEX_PAGE, dexPage*DEX_PAGE+DEX_PAGE);
  const {s,c}=dexCount();
  const got=list.filter(d=>caught[d.id]).length;
  let h=`<h2>📘 Livro de Pets</h2><p>Vistos ${s}/100 · Capturados ${c}/100</p><div class="tabs">`;
  DEX_TABS.forEach(([k,lab])=>{
    const n=k==='todos'?100:k==='lendario'?TEMPLOS.length:DEX.filter(d=>d.type===k).length;
    h+=`<button class="btn ${k===dexType?'on':''}" onclick="openDex('${k}',0)">${lab} (${n})</button>`;
  });
  h+=`</div><p>${DEX_TABS.find(x=>x[0]===dexType)[1]} · ${got}/${list.length} nesta aba · página ${dexPage+1}/${pages}</p><div class="dex">`;
  slice.forEach(d=>{
    const i=d.id, n='#'+String(i).padStart(3,'0');
    if(caught[i]) h+=`<i class="got" onclick="dexInfo(${i})"><span class="num">${n}</span>${petSVG(d,52)}</i>`;
    else h+=`<i onclick="dexInfo(${i})"><span class="num">${n}</span></i>`;
  });
  h+=`</div><div class="pager">
    <button class="btn" onclick="openDex('${dexType}',${dexPage-1})" ${dexPage<=0?'disabled':''}>◀</button>
    <span>${dexPage+1} / ${pages}</span>
    <button class="btn" onclick="openDex('${dexType}',${dexPage+1})" ${dexPage>=pages-1?'disabled':''}>▶</button>
  </div>
  <div class="row"><button class="btn" onclick="closeOv()">Fechar</button></div>`;
  overlay(h);
}
window.openDex=openDex;
function petSVG(d,s){
  const L=d.look||{body:d.id%6,ear:(d.id*3)%5,tail:(d.id*7)%4,spot:(d.id*11)%3};
  const c=d.color, k=d.type, id=d.id;
  const c2=shade(c,-30), c3=shade(c,35);
  let extra='';
  if(k==='agua') extra=`<ellipse cx="10" cy="40" rx="8" ry="4" fill="${c3}"/><ellipse cx="38" cy="40" rx="8" ry="4" fill="${c3}"/>`;
  if(k==='fogo') extra=`<path d="M24 4 C20 14 28 14 24 22 C30 14 28 6 24 4" fill="#ff9040"/>`;
  if(k==='planta') extra=`<ellipse cx="12" cy="10" rx="6" ry="10" fill="#3a8a3a" transform="rotate(-20 12 10)"/><ellipse cx="36" cy="10" rx="6" ry="10" fill="#3a8a3a" transform="rotate(20 36 10)"/>`;
  if(k==='vento') extra=`<path d="M8 18 Q0 24 8 28" stroke="${c3}" fill="none" stroke-width="3"/><path d="M40 18 Q48 24 40 28" stroke="${c3}" fill="none" stroke-width="3"/>`;
  if(k==='terra') extra=`<rect x="14" y="36" width="20" height="6" rx="2" fill="${c2}"/>`;
  if(k==='pedra') extra=`<polygon points="18,8 24,2 30,8" fill="${c2}"/>`;
  if(k==='fantasma') extra+=`<ellipse cx="24" cy="42" rx="10" ry="4" fill="${c3}" opacity=".5"/>`;
  if(k==='psico') extra+=`<circle cx="24" cy="14" r="3" fill="#fff"/><circle cx="24" cy="14" r="1.4" fill="#c040c0"/>`;
  if(d.legend) extra+=`<text x="24" y="12" text-anchor="middle" font-size="8" fill="#ffd24a">★</text>`;
  const bodies=[
    `<ellipse cx="24" cy="28" rx="14" ry="12" fill="${c}"/>`,
    `<ellipse cx="24" cy="26" rx="11" ry="15" fill="${c}"/>`,
    `<rect x="11" y="16" width="26" height="22" rx="8" fill="${c}"/>`,
    `<ellipse cx="24" cy="30" rx="16" ry="10" fill="${c}"/>`,
    `<polygon points="24,12 38,30 24,40 10,30" fill="${c}"/>`,
    `<ellipse cx="24" cy="28" rx="13" ry="13" fill="${c}"/>`
  ];
  const ears=['',`<circle cx="14" cy="16" r="4" fill="${c2}"/><circle cx="34" cy="16" r="4" fill="${c2}"/>`,`<polygon points="14,18 10,6 20,16" fill="${c2}"/><polygon points="34,18 38,6 28,16" fill="${c2}"/>`,`<rect x="12" y="10" width="5" height="10" rx="2" fill="${c2}"/><rect x="31" y="10" width="5" height="10" rx="2" fill="${c2}"/>`,`<circle cx="16" cy="14" r="3" fill="${c3}"/><circle cx="32" cy="14" r="3" fill="${c3}"/>`];
  const tail=L.tail?`<ellipse cx="8" cy="32" rx="${4+L.tail}" ry="3" fill="${c2}"/>`:'';
  const spots=L.spot?`<circle cx="20" cy="28" r="2" fill="${c3}"/><circle cx="28" cy="32" r="1.6" fill="${c3}"/>`:'';
  return `<svg width="${s}" height="${s}" viewBox="0 0 48 48">${bodies[L.body]}${ears[L.ear]||''}${tail}${spots}${extra}<circle cx="19" cy="26" r="1.6" fill="#111"/><circle cx="29" cy="26" r="1.6" fill="#111"/></svg>`;
}
function shade(hex,a){
  if(!hex||typeof hex!=='string') hex='#888888';
  hex=hex.replace('#',''); if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  const n=parseInt(hex,16); let r=(n>>16)+a,g=((n>>8)&255)+a,b=(n&255)+a;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function dexInfo(i){

  if(!caught[i]){

    return;
  }
  overlay(`<h2>${n}</h2>${petSVG(d,120)}<p><b>${d.name}</b>${d.legend?' ★ Lendário':''}</p>
    <p>Tipo ${TYPES[d.type].n} · Zona ${d.zone==='legend'?'templo':d.zone==='water'?'água':d.zone==='cave'?'caverna':'campo'}</p>
    <p>HP ${d.hp} · ATQ ${d.atk} · DEF ${d.def} · VEL ${d.spd}</p>
    <div class="row"><button class="btn" onclick="openDex()">Voltar</button></div>`);
}
window.dexInfo=dexInfo;

}
function sendTick(){

function tryRun(){
  if(battle.kind==='trainer'){toast('Não se foge de um líder!');return;}
  if(battle.p.st==='root'){toast('Enraizado!');return;}
  const ch=0.45+(battle.p.spd-battle.e.spd)*0.04;
  if(Math.random()<ch){endBattle(false,'Você fugiu.');} else {toast('Não fugiu!'); hideB(); battle.phase='wait'; setTimeout(enemyAct,400);}
}
function doMove(i){
  const m=battle.p.moves[i]; if(!m) return;
  if(m.pp<=0){toast('Sem PP!');return;}
  if(battle.kind==='pvp'){
    hideB(); battle.waiting=true; battle.phase='wait';
    addChat('Luta','Golpe escolhido. Esperando o outro…');
    if(net.role==='host'){ battle.picks=battle.picks||{}; battle.picks.host=i; tryResolvePvp(); }
    else netSend({t:'pick',i,id:net.peer&&net.peer.id});
    return;
  }
  m.pp--; hideB(); battle.phase='anim'; battle.anim=28; battle.flash=10; battle.moveFx=m; battle.pending=()=>resolveMove(battle.p,battle.e,m,true);
}
function resolveMove(att,def,m,playerSide){
  let txt=(att.nick||att.name)+' usou '+m.n+'!';
  if(m.t==='heal'){const h=m.p+att.lvl; att.hp=Math.min(att.maxhp,att.hp+h); txt+=` +${h} HP`; sfx('heal');}
  else if(m.t==='def'){att.defBuff=(att.defBuff||0)+1; txt+=' Defesa subiu!';}
  else {
    const tipo=m.tipo||att.type; let mul=(def.type==='fantasma'&&isCommon(m.tipo))?0:eff(tipo,def.type);
    if(def.st==='wet' && tipo==='fogo') mul*=0.5;
    if(def.st==='wet' && tipo==='agua') mul*=1.2;
    if(att.st==='burn') mul*=0.8;
    let dmg=Math.max(1,Math.round((att.atk*0.55+m.p)*mul*(0.88+Math.random()*0.24)));
    if(def.defBuff) dmg=Math.round(dmg*0.7);
    def.hp=Math.max(0,def.hp-dmg);
    if(mul===0) txt+=' Não fez efeito. Fantasma só ignora golpe normal.';
    else txt+=` ${dmg} de dano`+(mul>1?' · Super eficaz!':mul<1?' · Pouco eficaz…':'');
    if(m.st && Math.random()<0.45 && !def.st){def.st=m.st; txt+=' · '+({burn:'queimou',wet:'molhou',root:'enraizou'}[m.st]);}
    battle.shake=8; sfx('hit');
  }
  toast(txt,90);
  if(def.hp<=0){ if(playerSide){ if(!sendNextEnemy()) winB(); } else { if(!sendNextAlly()) loseB(); } return; }
  tickStatus(att);
  if(att.hp<=0){ if(playerSide){ if(!sendNextAlly()) loseB(); } else { if(!sendNextEnemy()) winB(); } return; }
  if(playerSide){ battle.phase='wait'; setTimeout(enemyAct,520); } else { battle.phase='menu'; showMainB(); }
}
function sendNextEnemy(){
  if(!battle.eTeam) return false;
  const i=battle.eTeam.findIndex((p,idx)=>idx>battle.eIndex && p.hp>0);
  if(i<0) return false;
  battle.eIndex=i; battle.e=battle.eTeam[i];
  toast('O próximo pet de '+battle.leader.name+' entra: '+battle.e.name+' ('+(i+1)+'/'+battle.eTeam.length+')');
  setTimeout(()=>{ battle.phase='menu'; showMainB(); },500);
  return true;
}
function sendNextAlly(){
  const i=team.findIndex((p,idx)=>idx!==0 && p.hp>0);
  if(i<0) return false;
  const t=team[0]; team[0]=team[i]; team[i]=t; battle.p=team[0];
  toast('Vai, '+(battle.p.nick||battle.p.name)+'!');
  setTimeout(()=>{ battle.phase='menu'; showMainB(); },500);
  return true;
}
function tickStatus(p){ if(p.st==='burn'){ const d=Math.max(1,Math.round(p.maxhp/8)); p.hp=Math.max(0,p.hp-d); toast((p.nick||p.name)+' queima -'+d,70); } }
function enemyAct(){
  if(state!=='battle'||!battle) return;
  const e=battle.e,p=battle.p; tickStatus(e); if(e.hp<=0){winB();return;}
  const opts=e.moves.filter(m=>m.pp>0); const m=opts[(Math.random()*opts.length)|0]||e.moves[0];
  if(m.pp>0) m.pp--;
  battle.phase='anim'; battle.anim=28; battle.flash=10; battle.moveFx=m; battle.pending=()=>resolveMove(e,p,m,false);
}
function capBase(ball){return ball==='hiperbola'?0.55:ball==='superbola'?0.32:0.14;}
function startCatch(ball){
  if(battle.kind==='trainer'){toast('Não captura pet de treinador.'); showMainB(); return;}
  const hpR=battle.e.hp/battle.e.maxhp;
  let ch=capBase(ball)+(1-hpR)*0.7; ch=Math.min(0.94,ch);
  battle.catch={ball,ch,phase:'fly',t:0,wobble:0,shakeN:0,done:false,ok:null,flash:0}; battle.phase='catch'; hideB();
  toast('Jogou a '+ball+'!');
}
function finishCatchOk(){
  try{
    const pet=battle&&battle.e;
    if(pet){
      markCaught(pet);
      const copy=Object.assign({},pet,{moves:(pet.moves||[]).map(m=>Object.assign({},m))});
      if(team.length<6) team.push(copy); else boxPets.push(copy);
      if(battle.bush){
        battle.bush.empty=480;
        const d=pickFrom(pool('grass'));
        battle.bush.key=d.key; battle.bush.lvl=1+((Math.random()*8)|0);
      }
      if(battle.g) battle.g.empty=500;
      if(battle.mob) battle.mob.empty=500;
      toast('Capturou '+(pet.nick||pet.name)+'! Livro #'+pet.dex);
    }
  }catch(err){ toast('Capturou!'); }
  battle.catch=null;
  endBattle();
}
function catchTick(){
  const c=battle.catch; if(!c||c.done) return;
  c.t++;
  if(c.phase==='fly'){ if(c.t>=20){c.phase='suck'; c.t=0;} return; }
  if(c.phase==='suck'){ if(c.t>=16){c.phase='drop'; c.t=0;} return; }
  if(c.phase==='drop'){ if(c.t>=12){c.phase='shake'; c.t=0; c.shakeN=1; sfx('ui'); toast('A bola balança... 1');} return; }
  if(c.phase==='shake'){
    c.wobble=Math.sin(c.t*0.9)*10;
    if(c.t>=22){
      const stay=Math.random()<c.ch+c.shakeN*0.06;
      if(!stay){ c.phase='fail'; c.t=0; c.done=false; sfx('fail'); toast('Quebrou!'); return; }
      if(c.shakeN>=3){ c.phase='ok'; c.t=0; c.flash=1; sfx('catch'); toast('Capturou!'); return; }
      c.shakeN++; c.t=0; sfx('ui'); toast('A bola balança... '+c.shakeN);
    }
    return;
  }
  if(c.phase==='fail'){
    if(c.t>=18){ c.done=true; battle.catch=null; battle.phase='wait'; setTimeout(enemyAct,400); }

function gainXpPet(p,amt){
  if(!p) return;
  p.xp=(p.xp||0)+amt;
  while(p.xp>=(p.xpNext||10) && p.lvl<20){
    p.xp-=p.xpNext; p.lvl++; p.xpNext=Math.floor(p.xpNext*1.35);
    p.maxhp+=4; p.hp=p.maxhp; p.atk+=2; p.def+=1; p.spd+=0.4; applyLearn(p);
    if(p.lvl===8||p.lvl===16){

function walkRows(rows, moving, fr){
  if(!moving) return rows;
  const f=((fr*0.25)|0)%2;

  const out=rows.slice();

  if(n>=3){
    const a=out[n-3], b=out[n-2], c=out[n-1];
    out[n-3]=a.split('').reverse().join('');
    out[n-2]=c;
    out[n-1]=b.split('').reverse().join('');
  }
  return out;
}

  if(s.type==='fantasma'){ctx.globalAlpha=0.7;ctx.fillStyle='#d0c8ff';ctx.beginPath();ctx.ellipse(0,16,10,6,0,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(s.type==='psico'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-8,3,0,7);ctx.fill();ctx.fillStyle='#c040c0';ctx.beginPath();ctx.arc(0,-8,1.4,0,7);ctx.fill();}
  if(L.spot){ctx.fillStyle=shade(col,45);ctx.beginPath();ctx.arc(-4,6,2,0,7);ctx.arc(5,8,1.6,0,7);ctx.fill();}
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-5,2,2,0,7); ctx.arc(5,2,2,0,7); ctx.fill();
  if(pet.evos||s.legend){ctx.fillStyle='#ffd24a'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('★',0,-22);}
  ctx.restore();
}
function drawBattle(){
  ctx.fillStyle='rgba(6,8,14,.6)'; ctx.fillRect(0,0,W,H);
  const p=battle.p,e=battle.e;
  let ex=W*0.72, ey=H*0.34, px=W*0.28, py=H*0.62;
  if(battle.phase==='anim'){
    const k=1-(battle.anim/28);
    if(battle.pending) px+=16*Math.sin(k*3.14);
    else ex-=16*Math.sin(k*3.14);
  }
  if(battle.waiting){
    ctx.fillStyle='#ffd24a'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Esperando o outro escolher o golpe…', W/2, 36);
  }
  if(battle.shake){ex+=(Math.random()-.5)*battle.shake; ey+=(Math.random()-.5)*battle.shake;}
  const c=battle.catch, s=battle.send;
  let esc=2.4, psc=2.2;
  if(c){
    if(c.phase==='suck') esc=2.4*(1-c.t/16);
    if(c.phase==='drop'||c.phase==='shake'||c.phase==='ok') esc=0;
    if(c.phase==='fail') esc=2.4*Math.min(1,c.t/12);
  }
  if(s){
    if(s.t<22) psc=0;
    else psc=2.2*Math.min(1,(s.t-22)/12);
  }
  if(esc>0.05) drawPet(e,ex,ey,esc,true);
  if(psc>0.05) drawPet(p,px,py,psc,false);
  if(s){
    const fromX=W*0.12, fromY=H*0.72, toX=px, toY=py;
    let bx=fromX, by=fromY, br=11;
    if(s.t<22){
      const k=s.t/22;
      bx=fromX+(toX-fromX)*k;
      by=fromY+(toY-fromY)*k - Math.sin(k*3.14)*70;
    } else {
      bx=toX; by=toY; br=11+(s.t-22)*0.8;
    }
    ctx.save(); ctx.translate(bx,by); ctx.rotate(s.t*0.25);
    ctx.fillStyle='#f4f4f4'; ctx.beginPath(); ctx.arc(0,0,br,0,7); ctx.fill();
    ctx.fillStyle='#3aa0ff'; ctx.fillRect(-br,-3,br*2,6);
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,0,3.5,0,7); ctx.fill();
    ctx.restore();
    if(s.t>=22 && s.t<34){
      ctx.fillStyle='#ffd24a';
      for(let i=0;i<8;i++) ctx.fillRect(toX+Math.cos(i+s.t)*18, toY+Math.sin(i+s.t)*14, 3,3);
    }
    ctx.fillStyle='#ffd24a'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    ctx.fillText(s.t<22?'Poképet, vai!':('Vai, '+(p.nick||p.name)+'!'), W/2, H*0.16);
  }
  if(battle.phase==='anim'&&battle.moveFx){
    const k=1-(battle.anim/28);
    const ax=battle.pending?px:ex, ay=battle.pending?py:ey, bx=battle.pending?ex:px, by=battle.pending?ey:py;
    const mx=ax+(bx-ax)*k, my=ay+(by-ay)*k;
    const col=(TYPES[(battle.moveFx.tipo||'nenhum')]||{}).c||'#fff';
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(mx,my,8+4*Math.sin(k*6),0,7); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(mx,my); ctx.stroke();
  }
  bar(W*0.52,H*0.14,220,e); bar(W*0.06,H*0.74,220,p);
  if(battle.eTeam){ ctx.fillStyle='#ffd24a'; ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('Inimigo '+(battle.eIndex+1)+'/'+battle.eTeam.length, W*0.52, H*0.14-8); }
  if(c){
    let bx=px, by=py-20, br=10;
    if(c.phase==='fly'){ const k=c.t/20; bx=px+(ex-px)*k; by=py+(ey-py)*k-Math.sin(k*3.14)*40; }
    else if(c.phase==='suck'){ bx=ex; by=ey; br=10+c.t*0.4; }
    else { bx=ex+(c.wobble||0); by=ey+18; br=14; }
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(bx,by+16,12,5,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(bx,by); ctx.rotate((c.wobble||0)*0.04);
    ctx.fillStyle='#f4f4f4'; ctx.beginPath(); ctx.arc(0,0,br,0,7); ctx.fill();
    ctx.fillStyle='#c33'; ctx.fillRect(-br,-3,br*2,6);
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,2,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#ffd24a'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    if(c.phase==='fly') ctx.fillText('Lá vai!',W/2,H*0.18);
    if(c.phase==='shake') ctx.fillText('Balanço '+c.shakeN+'/3',W/2,H*0.18);
    if(c.phase==='ok'){ ctx.fillText('Capturou!',W/2,H*0.18); for(let i=0;i<6;i++){ ctx.fillStyle='#ffd24a'; ctx.fillRect(bx+Math.cos(i+c.t*0.3)*22, by+Math.sin(i+c.t*0.3)*16, 3,3);} }
    if(c.phase==='fail') ctx.fillText('Escapou!',W/2,H*0.18);
  }
}
function bar(x,y,w,pet){
  if(!pet) return;
  const tp=TYPES[pet.type]||TYPES.nenhum;
  ctx.fillStyle='#000'; ctx.fillRect(x-2,y-2,w+4,40);
  ctx.fillStyle='#333'; ctx.fillRect(x,y,w,18);
  ctx.fillStyle=tp.c; ctx.fillRect(x,y,w*Math.max(0,(pet.hp||0)/(pet.maxhp||1)),18);
  ctx.fillStyle='#222'; ctx.fillRect(x,y+20,w,8);
  ctx.fillStyle='#7ec8ff'; ctx.fillRect(x,y+20,w*Math.max(0,Math.min(1,(pet.xp||0)/(pet.xpNext||1))),8);
  ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText(`${pet.nick||pet.name} Nv.${pet.lvl} ${tp.n}${pet.st?' · '+pet.st:''}`,x+4,y+13);
  ctx.fillStyle='#cfe4ff'; ctx.font='10px sans-serif';
  ctx.fillText('XP '+(pet.xp||0)+'/'+(pet.xpNext||10),x+4,y+27);
}

let frame=0; function loop(){frame++; try{ update(); draw(); }catch(err){ try{ if(state==='battle') endBattle(); else if(state==='house') leaveHouse(); }catch(e){} } requestAnimationFrame(loop);}
loop();

function openTitle(){
  state='menu';
  overlay(`<h2>🐾 Batalha de Animais</h2>
  <p>Escolha o personagem. Folha tem uma saída: Rota 1. Cure no hospital. Lendários no fundo das masmorras.</p>
  <div class="row">
    <button class="btn gold" onclick="pickHero(0)">Menino</button>
    <button class="btn gold" onclick="pickHero(1)">Menina</button>
  </div>
  <div class="row">
    <button class="btn" onclick="hostRoom()">Criar sala</button>
    <button class="btn" onclick="joinRoomAsk()">Entrar na sala</button>
  </div>
  <div class="row">
    <button class="btn" onclick="boot(false,true)">Mesmo aparelho</button>
    <button class="btn" onclick="boot(true,false)">Continuar save</button>
  </div>
  <p class="muted">Sala: código de 4 dígitos e internet.</p>`);
}
function pickHero(n){
  player.av={base:n,shirt:0,pants:0,shoes:0,hat:0};
  boot(false,false);
}
window.pickHero=pickHero;
window.openTitle=openTitle;
window.boot=(cont,friends)=>{
  friendsMode=!!friends; player2.on=!!friends;
  if(friends){ player2.x=player.x+36; player2.y=player.y; }
  closeOv();
  if(cont){ if(!loadGame()) toast('Ainda não há jogo salvo.'); }
  else { try{localStorage.removeItem('mundoPets_v4');localStorage.removeItem('mundoPets_v3');}catch(e){} toast(friends?'Dois jogadores no mesmo mapa.':'Nova aventura!'); }
};
openTitle();
})();
</script>
